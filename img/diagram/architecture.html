<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
  svg text { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
  .t { font-size: 15px; fill: #1f2937; }
  .s { font-size: 13px; fill: #4b5563; }
  .h { font-size: 17px; font-weight: 700; fill: #111827; }
  .w { font-size: 14px; font-weight: 700; fill: #fff; }
  .wn { font-size: 13px; fill: #fff; }
  .lb { font-size: 12.5px; font-weight: 700; }
</style></head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>

  <!-- 管理網段 -->
  <rect x="20" y="16" width="1360" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="40" y="44" class="h">管理網段 10.0.0.0/23</text>
  <text x="40" y="70" class="s">vCenter · NSX Manager · SDDC Manager · Supervisor 管理 10.0.1.222-226 · VNA 管理 10.0.1.209</text>
  <rect x="1040" y="28" width="320" height="46" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="1056" y="50" class="t" font-weight="700">外部 Harbor harbor01.home.lab</text>
  <text x="1056" y="68" class="s">10.0.0.86 · 自簽 CA · 專案 vks-apps / csi</text>

  <!-- VPC 區 -->
  <rect x="20" y="106" width="960" height="600" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="136" class="h">VCF VPC（namespace vks-lab 的 VPC vks-lab_cw1ha）</text>

  <!-- VKS node VM -->
  <rect x="44" y="160" width="370" height="300" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="186" class="h">VKS 節點（vks-cl01，CP ×1 + worker ×2）</text>
  <rect x="60" y="202" width="338" height="96" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="74" y="226" class="t" font-weight="700">Pod（RWX PVC：nas-nfs-rwx）</text>
  <text x="74" y="248" class="s">NFS CSI driver（image 從 Harbor csi 專案）</text>
  <text x="74" y="268" class="s">在節點上掛 192.168.17.20:/export/vks-rwx</text>
  <text x="74" y="288" class="s">ip route：192.168.17.0/24 dev eth1（直連）</text>
  <rect x="60" y="312" width="338" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="335" class="t">eth0 → SubnetSet public</text>
  <text x="74" y="355" class="s">192.168.16.x（VLAN 6）：Pod 對外、Service、LB</text>
  <rect x="60" y="378" width="338" height="66" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="74" y="401" class="t" font-weight="700">eth1 → Subnet nas-vlan7</text>
  <text x="74" y="421" class="s">secondary NIC · 192.168.17.64 起（NSX static IP）</text>
  <text x="74" y="438" class="s">只用來連 NAS</text>

  <!-- DTGW -->
  <rect x="450" y="160" width="270" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="466" y="186" class="h">Distributed Transit Gateway</text>
  <text x="466" y="208" class="s">在每台 ESXi 上分散式轉送，不需要 Edge</text>
  <text x="466" y="228" class="s">External Connection：VLAN 6</text>
  <text x="466" y="248" class="s">External IP Block vks-block</text>

  <!-- VNA -->
  <rect x="760" y="230" width="200" height="104" rx="10" fill="#6d28d9"/>
  <text x="776" y="256" class="w">VNA vks-vna</text>
  <text x="776" y="278" class="wn">DTGW 的有狀態服務</text>
  <text x="776" y="298" class="wn">LoadBalancer、NAT</text>
  <text x="776" y="320" class="wn">只有 LB / NAT 流量經過</text>

  <!-- VLAN 延伸 Subnet -->
  <rect x="450" y="378" width="510" height="104" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="466" y="404" class="h">VPC Subnet nas-vlan7（VLAN Extension，Layer 2）</text>
  <text x="466" y="428" class="s">External Connection nas-vlan7：Dedicated to Subnet、VLAN 7</text>
  <text x="466" y="448" class="s">不接 Transit Gateway、不經過 VNA，就是 VLAN 7 的 L2</text>
  <text x="466" y="468" class="s">IP block nas-vlan7-block 192.168.17.0/24（排除 .1-.63）</text>

  <!-- 說明 -->
  <rect x="44" y="510" width="916" height="180" rx="10" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="62" y="538" class="t" font-weight="700">重點</text>
  <text x="62" y="564" class="s">① VKS 節點用 secondary NIC（eth1）直接接 NAS 所在的 VLAN 7；NFS 由節點上的 NFS CSI 掛載，從 eth1 出去</text>
  <text x="62" y="588" class="s">② eth1 的 subnet 是 VLAN 延伸（Layer 2）：不接 Transit Gateway、不經過 VNA，NAS 和 eth1 在同一段，不經閘道</text>
  <text x="62" y="612" class="s">③ VPC 一般流量（eth0）由每台 ESXi 上的 Distributed Transit Gateway 轉送；VNA 只提供 LB / NAT 等有狀態服務</text>
  <text x="62" y="636" class="s">④ VLAN 延伸 subnet 的 static IP allocation 只能用 NSX API 建（UI 建的沒有 IP），再從 vCenter 分享給 namespace</text>
  <text x="62" y="660" class="s">⑤ 沒有 eth1 的話，Pod 掛 NFS 會從 eth0 走 VPC → VLAN 6 → 路由器 → VLAN 7（多繞一段、也受 VPC 規則影響）</text>

  <!-- 外部 VLAN -->
  <rect x="1010" y="160" width="370" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1030" y="188" class="h">VLAN 6 · 192.168.16.0/24</text>
  <text x="1030" y="212" class="s">閘道 192.168.16.254（沒有 NAT → 出不了網際網路）</text>
  <text x="1030" y="234" class="s">Pod 對外、拉 Harbor image、LB VIP</text>
  <rect x="1010" y="378" width="370" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1030" y="406" class="h">VLAN 7 · 192.168.17.0/24</text>
  <text x="1030" y="432" class="t" font-weight="700">NAS 192.168.17.20</text>
  <text x="1030" y="456" class="s">/export/vks-rwx（NFS 4.1，no_root_squash）</text>
  <text x="1030" y="480" class="s">只有 VKS 節點 eth1（.64 起）連進來</text>

  <!-- 藍：eth0 → DTGW → VLAN 6 -->
  <path d="M398,330 C430,330 420,226 448,222" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#ab)"/>
  <path d="M720,200 L1008,200" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#ab)"/>
  <text x="736" y="190" class="lb" fill="#1d4ed8">Pod 對外 / 拉 image：不經 VNA</text>
  <!-- 紫：LB -->
  <path d="M1008,246 C985,246 985,282 962,282" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 4" fill="none" marker-end="url(#ap)"/>
  <path d="M760,300 C730,300 700,290 690,274" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 4" fill="none" marker-end="url(#ap)"/>
  <!-- 橘：eth1 → VLAN 延伸 subnet → VLAN 7 NAS -->
  <path d="M398,411 L448,425" stroke="#ea580c" stroke-width="4" fill="none" marker-end="url(#ao)"/>
  <path d="M960,430 L1008,430" stroke="#ea580c" stroke-width="4" fill="none" marker-end="url(#ao)"/>
  <text x="404" y="446" class="lb" fill="#c2410c">NFS</text>

  <!-- 圖例 -->
  <line x1="1010" y1="560" x2="1056" y2="560" stroke="#2563eb" stroke-width="4"/>
  <text x="1066" y="565" class="t">eth0：VPC 流量（DTGW）</text>
  <line x1="1010" y1="590" x2="1056" y2="590" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="1066" y="595" class="t">LB / NAT：經過 VNA</text>
  <line x1="1010" y1="620" x2="1056" y2="620" stroke="#ea580c" stroke-width="4"/>
  <text x="1066" y="625" class="t">eth1：NFS，L2 直通 VLAN 7，不經 VNA</text>

  <text x="20" y="748" class="s" id="m1">實測（C-13-5）：A. Pod 寫 1 GiB 到 RWX PV → NAS 收到 1025 MiB、worker eth1 送出 1080 MB、eth0 0 MB、VNA 0.7 MB</text>
  <text x="20" y="772" class="s" id="m2">　　　　　　　 B. 經 VPC LoadBalancer 下載 1 GiB → VNA 1083 MB　　C. worker 從 Harbor 拉 430 MB image → VNA 2 MB</text>
</svg>
</body></html>
