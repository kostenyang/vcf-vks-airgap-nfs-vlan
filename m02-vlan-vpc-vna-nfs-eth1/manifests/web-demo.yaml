# 部署服務 demo:一個對外的網頁服務
#   - 網頁內容放在 NFS 的 RWX PV(StorageClass nas-nfs-rwx,節點經 eth1/VLAN 7 掛 NAS)
#   - 3 個 nginx Pod 共用同一份內容,改一次三個 Pod 一起生效
#   - 對外用 Service type LoadBalancer(VIP 由 VNA 從 External IP block 配)
#   - image 全部從內部 Harbor 拉;叢集預設 PSA = restricted,所以 Pod 都帶完整 securityContext
apiVersion: v1
kind: Namespace
metadata:
  name: web-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-content
  namespace: web-demo
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nas-nfs-rwx
  resources:
    requests:
      storage: 1Gi
---
# 第一次把首頁寫進 PV(之後可以用 kubectl exec 改)
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-content
  namespace: web-demo
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: seed
        image: harbor01.home.lab/vks-apps/busybox:1.37.0
        command: ["sh", "-c", "echo '<h1>web-demo v1</h1><p>content on NFS (RWX PV)</p>' > /content/index.html && ls -l /content"]
        volumeMounts:
        - {name: content, mountPath: /content}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: content
        persistentVolumeClaim: {claimName: web-content}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web-demo
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        image: harbor01.home.lab/vks-apps/nginx-unprivileged:1.30.4-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 5
        volumeMounts:
        - {name: content, mountPath: /usr/share/nginx/html, readOnly: true}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: content
        persistentVolumeClaim: {claimName: web-content}
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: web-demo
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
  - {name: http, port: 80, targetPort: 8080, protocol: TCP}
